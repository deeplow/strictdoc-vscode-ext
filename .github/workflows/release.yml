# Push a tag matching package.json's version (e.g. `git tag v0.1.0 && git push origin v0.1.0`)
# to test, package and publish the extension as a GitHub release with the .vsix attached.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies and bundle the Python libraries
        run: |
          npm ci
          uvx nox -s setup

      - name: Lint
        run: npm run lint

      - name: Python tests
        run: uvx nox -s tests

      - name: Package
        run: |
          npm run vsce-package
          mv strictdoc-trace.vsix "strictdoc-trace-$GITHUB_REF_NAME.vsix"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "strictdoc-trace-$GITHUB_REF_NAME.vsix"
          --title "$GITHUB_REF_NAME" --generate-notes
